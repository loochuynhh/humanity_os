{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="{% static 'assets/images/favicon.ico' %}">
    <title>{% block title %}Humanity OS - Admin Login{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/bootstrap-icons/bootstrap-icons.css' %}">

    <!-- Custom CSS -->
    {% block extra_css %}
    {% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Scripts -->
    <script src="{% static 'assets/js/core/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'assets/js/core/bootstrap.min.js' %}"></script>
    <script src="{% static 'assets/js/plugin/sweetalert/sweetalert2.all.min.js' %}"></script>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
