{% extends "layouts/base-auth.html" %}
{% load static %}

{% block content %}
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
    }
</style>

<div class="d-flex min-vh-100 w-100" style="overflow: hidden;">
    <!-- Left: Login Form -->
    <div class="d-flex flex-column justify-content-center align-items-center bg-white" style="flex: 1;">
        <div class="w-100 px-4" style="max-width: 420px;">
            <div class="mb-4 text-center">
                <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
                    <i class="bi bi-person-lock text-primary fs-3"></i>
                </div>
                <h3 class="fw-bold mt-3 mb-0">Đăng nhập</h3>
                <p class="text-muted small">Quản trị hệ thống Humanity OS</p>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}
                <input type="hidden" name="form_submitted" value="1">
                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Tên đăng nhập</label>
                    <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                           class="form-control {% if form.username.errors %}is-invalid{% endif %}"
                           placeholder="Nhập tên đăng nhập" required>
                </div>

                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Mật khẩu</label>
                    <div class="input-group">
                        <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                               class="form-control {% if form.password.errors %}is-invalid{% endif %}"
                               placeholder="Nhập mật khẩu" required>
                        <button class="btn btn-outline-secondary toggle-password" type="button"
                                data-target="{{ form.password.id_for_label }}">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">© 2025 Humanity OS</small>
            </div>
        </div>
    </div>

    <!-- Right: Full Background Image -->
    <div class="d-none d-lg-block" style="flex: 1; background-image: url('{% static "assets/img/curved-images/curved6.jpg" %}'); background-size: cover; background-position: center;">
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'assets/js/plugin/sweetalert/sweetalert2.all.min.js' %}"></script>
<script>
    $(document).ready(function () {
        $('.toggle-password').click(function () {
            const targetId = $(this).data('target');
            const input = $('#' + targetId);
            const icon = $(this).find('i');

            if (input.attr('type') === 'password') {
                input.attr('type', 'text');
                icon.removeClass('bi-eye').addClass('bi-eye-slash');
            } else {
                input.attr('type', 'password');
                icon.removeClass('bi-eye-slash').addClass('bi-eye');
            }
        });
    });

    document.addEventListener("DOMContentLoaded", function () {
        const isFormSubmitted = !!sessionStorage.getItem("login_attempt");

        {% if form.username.errors %}
        Swal.fire({
            icon: 'error',
            title: 'Lỗi tên đăng nhập',
            text: {{ form.username.errors|first|escapejs }},
            confirmButtonColor: '#ef4444'
        });
        {% endif %}

        {% if form.password.errors %}
        Swal.fire({
            icon: 'error',
            title: 'Lỗi mật khẩu',
            text: {{ form.password.errors|first|escapejs }},
            confirmButtonColor: '#ef4444'
        });
        {% endif %}

        {% if user.is_authenticated %}
        Swal.fire({
            icon: 'warning',
            title: 'Đã đăng nhập',
            text: "Bạn đã đăng nhập là {{ username }}, nhưng không có quyền truy cập trang này. Đăng nhập bằng tài khoản khác?",
            confirmButtonColor: '#f59e0b'
        });
        {% endif %}

        {% if form.non_field_errors %}
        if (isFormSubmitted) {
            Swal.fire({
                icon: 'warning',
                title: 'Cảnh báo',
                text: "Tên đăng nhập hoặc mật khẩu không chính xác",
                confirmButtonColor: '#f59e0b'
            });
            sessionStorage.removeItem("login_attempt");
        }
        {% endif %}

        const form = document.querySelector('form');
        if (form) {
            form.addEventListener("submit", function () {
                sessionStorage.setItem("login_attempt", "1");
            });
        }
    });

</script>
{% endblock %}
