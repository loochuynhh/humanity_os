{% load i18n %}

<div class="mb-3">
    <h6 class="text-uppercase text-body text-xs font-weight-bolder mb-2">{{ title }}</h6>
    <ul class="list-group">
        {% for choice in choices %}
            <li class="list-group-item border-0 px-0">
                <div class="form-check">
                    {% if choice.selected %}
                        <a href="{{ choice.query_string|iriencode }}" class="text-primary font-weight-bold">{{ choice.display }}</a>
                    {% else %}
                        <a href="{{ choice.query_string|iriencode }}" class="text-dark">{{ choice.display }}</a>
                    {% endif %}
                </div>
            </li>
        {% endfor %}
    </ul>
</div>
