{% load i18n %}

<div class="filter-group mb-2">
    <h6 class="text-muted small text-uppercase mb-1">{{ title }}</h6>
    <ul class="list-group list-group-flush">
        {% for choice in choices %}
            <li class="list-group-item px-0 py-1 border-0 {% if choice.selected %}selected{% endif %}">
                <a href="{{ choice.query_string|iriencode }}"
                   class="text-decoration-none {% if choice.selected %}link-primary fw-semibold{% else %}link-dark{% endif %}">
                    {{ choice.display }}
                </a>
            </li>
        {% endfor %}
    </ul>
</div>
