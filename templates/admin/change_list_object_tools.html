{% load i18n admin_urls %}

{% block object-tools-items %}
  {% if has_add_permission %}
    <div class="d-flex">
      {% url cl.opts|admin_urlname:'add' as add_url %}
      <a href="{% add_preserved_filters add_url is_popup to_field %}" class="btn btn-sm btn-primary">
        <i class="fas fa-plus me-2"></i> {% blocktrans with cl.opts.verbose_name as name %}Add {{ name }}{% endblocktrans %}
      </a>
    </div>
  {% endif %}
{% endblock %}
