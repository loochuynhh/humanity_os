<div class="container">
    <form id="evaluationForm">
        <input type="hidden" name="form_id" value="{{ form.id }}">
        <div class="mb-3">
            <label class="form-label text-sm fw-bold">Loại đánh giá</label>
            <input type="text" class="form-control form-control-sm" value="{{ form.type|title }}" readonly>
        </div>
        <div class="mb-3">
            <label for="target_user" class="form-label text-sm fw-bold">Người được đánh giá</label>
            <select id="target_user" name="target_user_id" class="form-select form-select-sm" required>
                <option value="">Chọn người được đánh giá</option>
                {% for user in target_users %}
                <option value="{{ user.id }}">{{ user.get_full_name }}</option>
                {% endfor %}
            </select>
        </div>
        {% for question in questions %}
        <div class="mb-3">
            <label class="form-label text-sm fw-bold">{{ forloop.counter }}. {{ question.question_text }}</label>
            {% if question.question_type == 'rating' %}
            <input type="number" name="answer_{{ question.id }}" class="form-control form-control-sm" min="1" max="{{ question.max_score }}" required>
            {% else %}
            <textarea name="answer_{{ question.id }}" class="form-control form-control-sm" rows="4" required></textarea>
            {% endif %}
        </div>
        {% empty %}
        <p class="text-muted text-sm">Không có câu hỏi nào trong form này.</p>
        {% endfor %}
    </form>
</div>
