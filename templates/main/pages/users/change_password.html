{% extends 'main/layouts/user_base.html' %}
{% block title %}Đổi Mật Khẩu - Humanity OS{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 fade-in">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-2 text-dark">Đổi Mật Khẩu</h2>
                <p class="text-center text-muted mb-4">Cập nhật mật khẩu của bạn</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-medium text-dark">Mật khẩu hiện tại</label>
                        <div class="input-group">
                            <input type="password" name="current_password" class="form-control border-start-0" required placeholder="Nhập mật khẩu hiện tại" id="current_password">
                            <button class="btn btn-outline-secondary border-start-0 toggle-password" type="button" data-target="current_password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium text-dark">Mật khẩu mới</label>
                        <div class="input-group">
                            <input type="password" name="new_password" class="form-control border-start-0" required placeholder="Nhập mật khẩu mới" id="new_password">
                            <button class="btn btn-outline-secondary border-start-0 toggle-password" type="button" data-target="new_password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium text-dark">Xác nhận mật khẩu mới</label>
                        <div class="input-group">
                            <input type="password" name="confirm_password" class="form-control border-start-0" required placeholder="Xác nhận mật khẩu" id="confirm_password">
                            <button class="btn btn-outline-secondary border-start-0 toggle-password" type="button" data-target="confirm_password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 py-2 fw-medium">
                        <i class="bi bi-key-fill me-2"></i>Cập Nhật Mật Khẩu
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
{% block extra_js %}
<script>
$(document).ready(function() {
    $('.toggle-password').click(function() {
        const targetId = $(this).data('target');
        const input = $('#' + targetId);
        const icon = $(this).find('i');

        if (input.attr('type') === 'password') {
            input.attr('type', 'text');
            icon.removeClass('bi-eye').addClass('bi-eye-slash');
        } else {
            input.attr('type', 'password');
            icon.removeClass('bi-eye-slash').addClass('bi-eye');
        }
    });
});
</script>
{% endblock %}
