{% extends 'main/layouts/user_base.html' %}
{% block title %}Đăng Nhập - Humanity OS{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 fade-in">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-2 text-dark">Đăng Nhập</h2>
                <p class="text-center text-muted mb-4">Chào mừng đến với Humanity OS</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-medium text-dark">Tên đăng nhập</label>
                        <div class="input-group">
                            <input type="text" name="username" class="form-control border-start-0" required placeholder="Nhập tên đăng nhập">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium text-dark">Mật khẩu</label>
                        <div class="input-group">
                            <input type="password" name="password" class="form-control border-start-0" required placeholder="Nhập mật khẩu" id="password">
                            <button class="btn btn-outline-secondary border-start-0 toggle-password" type="button" data-target="password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
                    </button>
                </form>
                <div class="text-center mt-4">
                    <a href="{% url 'users:forgot_password' %}" class="text-muted text-decoration-none hover-link">Quên mật khẩu?</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
{% block extra_js %}
<script>
$(document).ready(function() {
    $('.toggle-password').click(function() {
        const targetId = $(this).data('target');
        const input = $('#' + targetId);
        const icon = $(this).find('i');

        if (input.attr('type') === 'password') {
            input.attr('type', 'text');
            icon.removeClass('bi-eye').addClass('bi-eye-slash');
        } else {
            input.attr('type', 'password');
            icon.removeClass('bi-eye-slash').addClass('bi-eye');
        }
    });
});
</script>
{% endblock %}
